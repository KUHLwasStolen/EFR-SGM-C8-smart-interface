<!DOCTYPE html>
<html lang="en">
<head>
 <title>Settings</title>
 <link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg">
 <link rel="stylesheet" href="../styles.css">
 <script type="text/javascript" src="settings.js"></script>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<h1>EFR-SGM-C8 Settings</h1>
<form action="javascript:void(0);">
<fieldset>
 <legend>Import costs</legend>
 <div><label for="1.8.0">1.8.0:</label>
 <input type="number" min="0" step="0.01" id="1.8.0" placeholder="0.00"></div>
 <div><label for="1.8.1">1.8.1:</label>
 <input type="number" min="0" step="0.01" id="1.8.1" placeholder="0.00"></div>
 <div><label for="1.8.2">1.8.2:</label>
 <input type="number" min="0" step="0.01" id="1.8.2" placeholder="0.00"></div>
</fieldset>
<fieldset>
 <legend>Export prices</legend>
 <div><label for="2.8.0">2.8.0:</label>
 <input type="number" min="0" step="0.01" id="2.8.0" placeholder="0.00"></div>
 <div><label for="2.8.1">2.8.1:</label>
 <input type="number" min="0" step="0.01" id="2.8.1" placeholder="0.00"></div>
 <div><label for="2.8.2">2.8.2:</label>
 <input type="number" min="0" step="0.01" id="2.8.2" placeholder="0.00"></div>
</fieldset>
<fieldset>
 <div><label for="unit">Unit:</label>
 <input type="text" id="unit" maxlength="3" placeholder="€" required></div>
</fieldset>
<div><button class="button" onclick="sendSettings()">Set</button></div>
</form>
<p class="put-status"></p>
</body>
</html>
